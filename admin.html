<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a7cff">
  <title>车辆成本计算器 · 数据概览</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #17243a; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: #f4f7fb; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 56px; }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: #1769d9; font-size: 13px; font-weight: 700; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #29c56a; box-shadow: 0 0 0 4px #ddf8e8; }
    h1 { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: 0; }
    .subtitle { margin: 8px 0 0; color: #718099; font-size: 14px; line-height: 1.6; }
    .access-panel, .dashboard { background: #fff; border: 1px solid #e3eaf4; border-radius: 12px; box-shadow: 0 10px 28px rgba(31, 64, 112, .06); }
    .access-panel { width: min(440px, 100%); margin: 72px auto 0; padding: 32px; }
    .access-panel h2 { margin: 0; font-size: 20px; }
    .access-panel p { margin: 8px 0 22px; color: #718099; font-size: 14px; line-height: 1.6; }
    .access-form { display: grid; gap: 12px; }
    .access-form label { color: #4f5f77; font-size: 13px; font-weight: 700; }
    .access-form input { width: 100%; height: 44px; padding: 0 12px; color: #17243a; background: #fff; border: 1px solid #cfd9e7; border-radius: 7px; outline: none; }
    .access-form input:focus { border-color: #0a7cff; box-shadow: 0 0 0 3px #e3f0ff; }
    .primary-button, .secondary-button { min-height: 42px; padding: 0 15px; border-radius: 7px; font-weight: 700; }
    .primary-button { color: #fff; background: #0879f9; border: 1px solid #0879f9; }
    .primary-button:hover { background: #066bdc; }
    .secondary-button { color: #40516b; background: #fff; border: 1px solid #ced9e7; }
    .secondary-button:hover { background: #f6f9fd; }
    .form-error { min-height: 19px; margin: 0; color: #d92d20; font-size: 13px; }
    .dashboard { overflow: hidden; }
    .dashboard[hidden], .access-panel[hidden] { display: none; }
    .dashboard-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #e8eef6; }
    .dashboard-bar h2 { margin: 0; font-size: 17px; }
    .dashboard-actions { display: flex; gap: 8px; }
    .dashboard-body { padding: 24px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .metric { min-height: 132px; padding: 19px; background: #f8fbff; border: 1px solid #e5eef9; border-radius: 8px; }
    .metric-label { margin: 0; color: #70809a; font-size: 13px; }
    .metric-value { margin: 14px 0 0; color: #14284a; font-size: 32px; font-weight: 800; letter-spacing: 0; line-height: 1; font-variant-numeric: tabular-nums; }
    .metric-hint { margin: 10px 0 0; color: #8b99ad; font-size: 12px; line-height: 1.45; }
    .section-title { margin: 30px 0 12px; font-size: 16px; }
    .insight-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .insight { padding: 17px 18px; border-left: 3px solid #0a7cff; background: #f7faff; }
    .insight p { margin: 0; color: #73819a; font-size: 13px; }
    .insight strong { display: block; margin-top: 7px; color: #17243a; font-size: 22px; font-variant-numeric: tabular-nums; }
    .updated-at { margin: 23px 0 0; color: #8b99ad; font-size: 12px; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 28px, 560px); padding: 28px 0 40px; }
      .masthead { display: block; margin-bottom: 20px; }
      h1 { font-size: 25px; }
      .access-panel { margin-top: 40px; padding: 24px 20px; }
      .dashboard-bar, .dashboard-body { padding: 18px; }
      .metric-grid, .insight-grid { grid-template-columns: 1fr; }
      .metric { min-height: 108px; }
      .metric-value { font-size: 29px; }
      .dashboard-bar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow"><span class="status-dot"></span>PRIVATE ANALYTICS</p>
        <h1>车辆成本计算器 · 数据概览</h1>
        <p class="subtitle">仅展示聚合行为数据，不包含访客身份或参数明细。</p>
      </div>
    </header>

    <section class="access-panel" id="accessPanel" aria-labelledby="accessTitle">
      <h2 id="accessTitle">验证访问口令</h2>
      <p>口令仅用于本次请求，关闭或刷新页面后需要重新输入。</p>
      <form class="access-form" id="accessForm">
        <label for="accessToken">管理口令</label>
        <input id="accessToken" type="password" autocomplete="current-password" required>
        <button class="primary-button" type="submit">查看数据</button>
        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <section class="dashboard" id="dashboard" hidden aria-live="polite">
      <div class="dashboard-bar">
        <h2>累计行为</h2>
        <div class="dashboard-actions">
          <button class="secondary-button" type="button" id="refreshButton">刷新</button>
          <button class="secondary-button" type="button" id="logoutButton">退出</button>
        </div>
      </div>
      <div class="dashboard-body">
        <div class="metric-grid">
          <article class="metric"><p class="metric-label">累计访问</p><p class="metric-value" data-metric="visit">0</p><p class="metric-hint">页面打开总次数</p></article>
          <article class="metric"><p class="metric-label">完成计算</p><p class="metric-value" data-metric="calculation_completed">0</p><p class="metric-hint">修改参数后获得结果</p></article>
          <article class="metric"><p class="metric-label">生成图片</p><p class="metric-value" data-metric="result_card_generated">0</p><p class="metric-hint">点击生成分享卡片</p></article>
          <article class="metric"><p class="metric-label">复制 / 分享</p><p class="metric-value" data-metric="result_shared">0</p><p class="metric-hint">点击复制或分享结果</p></article>
          <article class="metric"><p class="metric-label">反馈意愿</p><p class="metric-value" data-metric="feedback_clicked">0</p><p class="metric-hint">点击提交反馈</p></article>
          <article class="metric"><p class="metric-label">再次访问</p><p class="metric-value" data-metric="return_visit">0</p><p class="metric-hint">同浏览器隔天回访</p></article>
        </div>

        <h3 class="section-title">核心转化</h3>
        <div class="insight-grid">
          <article class="insight"><p>访问后开始计算</p><strong data-conversion="calculationRate">0.0%</strong></article>
          <article class="insight"><p>计算后生成图片</p><strong data-conversion="cardRate">0.0%</strong></article>
          <article class="insight"><p>计算后复制 / 分享</p><strong data-conversion="shareRate">0.0%</strong></article>
        </div>
        <p class="updated-at" id="updatedAt"></p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const accessPanel = document.querySelector('#accessPanel');
      const dashboard = document.querySelector('#dashboard');
      const form = document.querySelector('#accessForm');
      const input = document.querySelector('#accessToken');
      const error = document.querySelector('#formError');
      let activeToken = '';

      const formatNumber = (value) => new Intl.NumberFormat('zh-CN').format(Number(value || 0));
      const formatPercent = (value) => `${(Number(value || 0) * 100).toFixed(1)}%`;

      function render(payload) {
        document.querySelectorAll('[data-metric]').forEach((element) => {
          element.textContent = formatNumber(payload.metrics[element.dataset.metric]);
        });
        document.querySelectorAll('[data-conversion]').forEach((element) => {
          element.textContent = formatPercent(payload.conversion[element.dataset.conversion]);
        });
        document.querySelector('#updatedAt').textContent = `更新时间：${new Date(payload.updatedAt).toLocaleString('zh-CN')}`;
      }

      async function loadStats() {
        const response = await fetch('/api/stats', {
          headers: { Authorization: `Bearer ${activeToken}` },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(response.status === 401 ? '口令不正确或已失效。' : '暂时无法读取统计数据。');
        return response.json();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        activeToken = input.value;
        try {
          render(await loadStats());
          input.value = '';
          accessPanel.hidden = true;
          dashboard.hidden = false;
        } catch (requestError) {
          activeToken = '';
          error.textContent = requestError.message;
        }
      });

      document.querySelector('#refreshButton').addEventListener('click', async () => {
        try { render(await loadStats()); } catch (requestError) { error.textContent = requestError.message; }
      });

      document.querySelector('#logoutButton').addEventListener('click', () => {
        activeToken = '';
        dashboard.hidden = true;
        accessPanel.hidden = false;
        input.focus();
      });
    })();
  </script>
</body>
</html>
